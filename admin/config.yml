- name: "blog-posts"
  label: "Blog Posts"
  folder: "/_blog/"
  create: true
  fields:
    - { label: 'Title', name: 'title', widget: 'string' }
    - { name: 'layout', widget: 'string', default: 'post' }
    - { label: 'Publish Date', name: 'date', widget: 'string', default: null}
    - { label: 'Image', name: 'image', widget: 'image', required: false }
    - { label: 'description', name: 'description', widget: 'text', required: false  }
    - { label: 'intro', name: 'intro', widget: 'text', required: false  }
    - { label: 'Slug', name: 'slug', widget: 'string', required: false, default: null}

    - name: intro_image
      label: image for intro section
      widget: object
      required: false
      fields:
      - { label: 'Image', name: 'image', widget: 'image', required: false }
      - { label: 'Caption', name: 'caption', widget: 'text', required: false }
    - { label: 'Body', name: 'body', widget: 'markdown' , required: false }

- name: "guides"
  label: "Guide single collection"
  folder: "/_guide/"
  create: true
  fields:
    - { label: 'Title', name: 'title', widget: 'string' }
    - { label: 'Slug', name: 'slug', widget: 'string', required: false, default: null }
    - { label: 'Meta Title', name: 'meta_title', widget: 'string', required: false }
    - { name: 'layout', widget: 'string', default: 'guide' }
    - { label: 'Publish Date', name: 'date', widget: 'string', required: false }
    - { label: 'description', name: 'description', widget: 'text', required: false  }
    - { label: 'Image', name: 'image', widget: 'image', required: false }
    - { label: 'intro', name: 'intro', widget: 'text', required: false  }
    - name: intro_image
      label: image for intro section
      widget: object
      required: false
      fields:
      - { label: 'Image', name: 'image', widget: 'image', required: false }
      - { label: 'Caption', name: 'caption', widget: 'text', required: false }
    - { label: 'Body', name: 'body', widget: 'markdown' , required: false }

- name: markdown-pages
  label: Markdown Pages
  folder: _pages
  create: true
  fields:
    - { label: 'Title', name: 'title', widget: 'string' }
    - { label: 'Meta Title', name: 'meta_title', widget: 'string', required: false }
    - { name: 'layout', widget: 'string', default: 'page' }
    - { name: 'page_id', widget: 'string', default: 'page' }
    - { name: 'class', widget: 'string', required: false }
    - { label: 'description', name: 'description', widget: 'text', required: false  }
    - { label: 'intro', name: 'intro', widget: 'text', required: false  }
