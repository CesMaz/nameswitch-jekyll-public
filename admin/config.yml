- name: pages
  label: Pages data
  files: 
  - name: home
    label: Home
    file: /_data/home.yml
    fields:
    - name: hero
      label: Hero section
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: subtitle, widget: string}
      - name: description
        widget: text
      - name: cta
        label: Call to action
        widget: object
        fields:
        - {name: name, widget: string}
        - {name: link, widget: string}
    - name: intro
      label: intro
      widget: markdown 
    - name: content
      label: Content
      widget: markdown 
    - name: steps
      label: Steps section
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: subtitle, widget: string}
      - name: items
        widget: list
        fields:
        - {name: name, widget: string }
        - {name: image, widget: image }
      - name: how_works
        label: How it works
        widget: object
        fields:
        - {name: title, widget: string}
        - {name: cta_title, widget: string}
        - name: tab
          label: Tab
          widget: list
          add_to_top: true
          minimize_collapsed: false
          field:
            name: col
            label: Column
            minimize_collapsed: false
            widget: text
            
    - name: advantages
      label: advantages
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: cta_title, widget: string}
      - name: items
        widget: list
        fields:
        - {name: title, widget: string }
        - {name: text, widget: text }
        - {name: image, widget: image }
      - name: info
        label: info
        widget: list
        field:
          {name: p, widget: text}

    - name: awards
      label: awards
      widget: object
      fields:
      - {name: title, widget: string}
      - name: items
        widget: list
        field:
          {name: image, widget: image }

    - name: do_alone
      label: Do alone
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: icon, widget: image}
      - name: col-1
        widget: text
        field:
          {name: p, widget: text }
      - name: col-2
        widget: list
        field:
          {name: p, widget: text }

    - name: do_together
      label: Do together
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: icon, widget: image}
      - name: cols
        widget: list
        field:
          {name: p, widget: string }
      - name: gb_title
        widget: string
      - name: gb_items
        widget: list
        field:
          {name: img, widget: image }

    - name: why_choose_us
      label: why choose us
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: image, widget: image}
      - name: text
        widget: text

    - name: sequre
      label: sequre
      widget: object
      fields:
      - {name: title, widget: string}
      - {name: image, widget: image}
      - name: text
        widget: list
        field:
          {name: p, widget: string }

    - name: brands
      label: brands
      widget: list
      field:
        {name: image, widget: image}

  - name: packages
    label: Packages
    file: /_data/packages.yml
    fields:
    - name: hero
      label: Hero section
      widget: object
      fields:
      - {name: image, widget: image}
      - {name: title, widget: string}
      - {name: text, widget: string}
    - name: intro
