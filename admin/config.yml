backend: 
  name: git-gateway
 # name: github
  repo: CesMaz/nameswitch-jekyll
 # repo: vosaul/NameSwitch
  branch: main
 # Path to your GitHub repository
media_folder: "/_images/"
public_folder: "/_images/"
publish_mode: editorial_workflow

collections:
- name: pages_frontmatter
  label: Pages frontmatter
  files: 
  - name: home
    label: Home
    file: /index.html
    fields:
    - name: title
      widget: string
    - name: image
      widget: image
      required: false
    - name: description
      widget: text
      required: false
    - name: page_id
      widget: string
    - name: video_id
      widget: string
